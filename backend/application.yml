spring:
  datasource:
    # 连接到 MySQL 数据库，使用容器内部网络 mysql 服务名
    url: jdbc:mysql://localhost:3306/warehouse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    cors:
      # 允许跨域访问，方便前端开发环境调用后端 API
      # 当 allow-credentials 为 true 时，不能将 allowed-origins 设置为 "*"
      allowed-origin-patterns: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  sql:
    init:
      # 应用启动时始终执行 schema.sql 初始化数据库结构
      mode: always
      schema-locations: classpath:schema.sql
server:
  # 后端默认监听端口
  port: 8080
mybatis:
  configuration:
    # 启用下划线转驼峰映射，例如 user_name -> userName
    map-underscore-to-camel-case: true

services:
  # MySQL 服务，用于存储仓库系统数据
  mysql:
    image: mysql:8.0
    container_name: warehouse-mysql
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: 'warehouse_db'
    volumes:
      - mysql-data:/var/lib/mysql
    # 使用 utf8mb4 字符集保证兼容中文和 Emoji
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\'123456\' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - warehouse-net

  # 后端服务，运行 Spring Boot 应用
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouse-backend
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/warehouse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: '123456'
    networks:
      - warehouse-net

  # 前端服务，提供静态页面并反向代理 API 请求
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warehouse-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - warehouse-net

# 所有服务共享的自定义网络
networks:
  warehouse-net:
    driver: bridge

# MySQL 数据持久化卷
volumes:
  mysql-data:
    driver: local
